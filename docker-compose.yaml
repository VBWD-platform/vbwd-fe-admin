services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dev:
        condition: service_healthy
    profiles:
      - dev

  # Development mode with hot reload
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../vbwd-fe-core:/app/vbwd-fe-core
      - node_modules:/app/node_modules
      # Shared plugin state — same directory the backend writes to. The
      # backend is the only writer, fe-admin mounts read-only so the
      # browser sees the same manifest every other container sees.
      - ${VBWD_VAR_DIR:-../var}/plugins/fe-admin-plugins.json:/app/vue/public/plugins.json:ro
      - ${VBWD_VAR_DIR:-../var}/plugins/fe-admin-plugins-config.json:/app/vue/public/config.json:ro
    command: sh -c "sh bin/npm-install-local-fe-core.sh --no-package-lock && npm run dev -- --host"
    environment:
      - VITE_API_URL=/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s
    profiles:
      - dev

  # Test runner
  test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../vbwd-fe-core:/app/vbwd-fe-core
      - node_modules:/app/node_modules
    command: sh -c "sh bin/npm-install-local-fe-core.sh && npm run test"
    profiles:
      - test

  # Watch mode for tests
  test-watch:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../vbwd-fe-core:/app/vbwd-fe-core
      - node_modules:/app/node_modules
    command: sh -c "sh bin/npm-install-local-fe-core.sh && npm run test:watch"
    profiles:
      - test-watch

  # Style checks
  lint:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../vbwd-fe-core:/app/vbwd-fe-core
      - node_modules:/app/node_modules
    command: sh -c "sh bin/npm-install-local-fe-core.sh && ./bin/pre-commit-check.sh --style"
    profiles:
      - lint

  # Unit tests
  unit:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../vbwd-fe-core:/app/vbwd-fe-core
      - node_modules:/app/node_modules
    command: sh -c "sh bin/npm-install-local-fe-core.sh && ./bin/pre-commit-check.sh --unit"
    profiles:
      - unit

  # Integration tests
  integration:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../vbwd-fe-core:/app/vbwd-fe-core
      - node_modules:/app/node_modules
    command: sh -c "sh bin/npm-install-local-fe-core.sh && ./bin/pre-commit-check.sh --integration"
    profiles:
      - integration

volumes:
  node_modules: