server {
    listen 80;
    resolver 127.0.0.11 valid=5s;

    set $vite http://dev:5173;
    set $backend http://host.docker.internal:5000;

    client_max_body_size 20m;

    # AI generation routes (cms-ai) call out to slow LLM / image providers and
    # can take minutes; raise the read/send timeout so long generations don't
    # 504. nginx matches the longest prefix, so the general /api/ block below
    # keeps its default (~60s) cap. (More specific location must precede /api/.)
    location /api/v1/plugins/cms-ai/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploaded files (images, etc.) to backend
    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite HMR websocket at the app base path. Vite base is /admin/, so the
    # client connects to /admin/__vite_hmr; this block adds the Upgrade headers
    # so the handshake becomes a WebSocket (101) instead of falling through to
    # the catch-all location / (no Upgrade -> 200 -> handshake fails).
    location /admin/__vite_hmr {
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Vite HMR websocket (root path, kept for non-/admin setups).
    location /__vite_hmr {
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Everything else to Vite dev server
    location / {
        proxy_pass $vite;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}