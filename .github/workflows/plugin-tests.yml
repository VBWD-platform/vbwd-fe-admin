name: Plugin Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  unit:
    name: Unit — ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [analytics-widget, booking, cms-admin, email-admin, ghrm-admin, license-authority-admin, tarot-admin]

    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure private plugin auth
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PLUGIN_PAT:-}" ]; then
            git config --global \
              url."https://x-access-token:${PLUGIN_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
      - name: Install ALL plugins
        run: |
          for entry in "analytics-widget:vbwd-fe-admin-plugin-analytics-widget" "cms-admin:vbwd-fe-admin-plugin-cms" "email-admin:vbwd-fe-admin-plugin-email" "ghrm-admin:vbwd-fe-admin-plugin-ghrm" "license-authority-admin:vbwd-fe-admin-plugin-license-authority" "tarot-admin:vbwd-fe-admin-plugin-tarot" "booking:vbwd-fe-admin-plugin-booking"; do
            name="${entry%%:*}"; repo="${entry##*:}"
            git clone --depth=1 -q "https://github.com/VBWD-platform/${repo}.git" "plugins/$name" 2>/dev/null || echo "Skipping $name"
          done
      - name: Run style + unit
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --unit

  integration:
    name: Integration — ${{ matrix.plugin }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [booking, cms-admin, ghrm-admin, tarot-admin]

    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure private plugin auth
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PLUGIN_PAT:-}" ]; then
            git config --global \
              url."https://x-access-token:${PLUGIN_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
      - name: Install ALL plugins
        run: |
          for entry in "analytics-widget:vbwd-fe-admin-plugin-analytics-widget" "cms-admin:vbwd-fe-admin-plugin-cms" "email-admin:vbwd-fe-admin-plugin-email" "ghrm-admin:vbwd-fe-admin-plugin-ghrm" "license-authority-admin:vbwd-fe-admin-plugin-license-authority" "tarot-admin:vbwd-fe-admin-plugin-tarot" "booking:vbwd-fe-admin-plugin-booking"; do
            name="${entry%%:*}"; repo="${entry##*:}"
            git clone --depth=1 -q "https://github.com/VBWD-platform/${repo}.git" "plugins/$name" 2>/dev/null || echo "Skipping $name"
          done
      - name: Run integration tests
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --integration
