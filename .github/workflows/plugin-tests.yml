name: Plugin Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests — ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - analytics-widget
          - booking
          - cms-admin
          - email-admin
          - ghrm-admin
          - taro-admin

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build vbwd-fe-core submodule
        run: cd vbwd-fe-core && npm install && npm run build

      - run: npm install

      - name: Install ALL plugins (vue-tsc needs full project)
        run: |
          for entry in "analytics-widget:vbwd-fe-admin-plugin-analytics-widget" "cms-admin:vbwd-fe-admin-plugin-cms" "email-admin:vbwd-fe-admin-plugin-email" "ghrm-admin:vbwd-fe-admin-plugin-ghrm" "taro-admin:vbwd-fe-admin-plugin-taro" "booking:vbwd-fe-admin-plugin-booking"; do
            name="${entry%%:*}"; repo="${entry##*:}"
            git clone --depth=1 -q "https://github.com/VBWD-platform/${repo}.git" "plugins/$name" 2>/dev/null || echo "Skipping $name"
          done

      - name: Run pre-commit (style + unit) for plugin
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --unit
